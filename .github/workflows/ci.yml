name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff check + format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ruff
        # Pinned to commit SHA (resolves to v3 as of 2026-05-21).
        # Force-pushed tags can swap the action body; SHA pin prevents that.
        uses: astral-sh/ruff-action@4919ec5cf1f49eff0871dbcea0da843445b837e6  # v3
        with:
          version: "0.14.11"

      - name: ruff check
        run: ruff check deep_research/

      - name: ruff format --check
        run: ruff format --check deep_research/
