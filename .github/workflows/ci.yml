name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff check + format)
    runs-on: ubuntu-latest
    steps:
      # First-party action, but the same force-pushed-tag argument we use for
      # ruff-action below applies — pin for consistency.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Install ruff
        # Pinned to commit SHA (resolves to v3 as of 2026-05-21).
        # Force-pushed tags can swap the action body; SHA pin prevents that.
        # `args: --version` suppresses the action's built-in `ruff check .`
        # default so the explicit steps below are the only thing that gates
        # CI. Without this, the action silently checks the whole workspace
        # (broader than the deep_research/-only scope this PR is opting in to).
        uses: astral-sh/ruff-action@4919ec5cf1f49eff0871dbcea0da843445b837e6  # v3
        with:
          version: "0.14.11"
          args: "--version"

      - name: ruff check
        run: ruff check deep_research/

      - name: ruff format --check
        run: ruff format --check deep_research/

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # py310 is the floor declared in pyproject's ruff target-version;
        # 3.12 guards against version-specific breakage above it.
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      # SHA-pinned per the same force-pushed-tag argument as the lint job.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # The suite imports deep_research.* without the external DRB harness on
      # disk; that import is lazy as of the A2 fix, so collection succeeds here.
      # No DRB_REPO is set, so any criteria-regen path raises its clear deferred
      # error rather than running — the harness-dependent code is not exercised.
      - name: Run tests
        run: pytest -q
